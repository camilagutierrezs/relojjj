<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reloj Rosa Interactivo</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
            serif: ['Playfair Display', 'serif'],
          }
        }
      }
    }
  </script>

  <style>
    /* Estilos personalizados para el deslizador */
    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      background: transparent;
    }

    input[type=range]:focus {
      outline: none;
    }

    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 10px;
      cursor: pointer;
      background: linear-gradient(90deg, #fbcfe8 0%, #ec4899 100%);
      border-radius: 9999px;
    }

    input[type=range]::-webkit-slider-thumb {
      height: 24px;
      width: 24px;
      border-radius: 50%;
      background: #ffffff;
      border: 3px solid #db2777;
      cursor: pointer;
      -webkit-appearance: none;
      margin-top: -7px;
      box-shadow: 0 4px 10px rgba(219, 39, 119, 0.3);
      transition: transform 0.15s ease;
    }

    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    input[type=range]::-moz-range-track {
      width: 100%;
      height: 10px;
      cursor: pointer;
      background: linear-gradient(90deg, #fbcfe8 0%, #ec4899 100%);
      border-radius: 9999px;
    }

    input[type=range]::-moz-range-thumb {
      height: 24px;
      width: 24px;
      border-radius: 50%;
      background: #ffffff;
      border: 3px solid #db2777;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(219, 39, 119, 0.3);
    }

    .clock-shadow {
      box-shadow: 
        0 20px 40px -10px rgba(236, 72, 153, 0.25),
        inset 0 2px 6px rgba(255, 255, 255, 0.9),
        inset 0 -6px 12px rgba(219, 39, 119, 0.15);
    }

    /* Punto de origen exacto en la base inferior para la rotación correcta */
    .hand {
      transform-origin: 50% 100%;
    }
  </style>
</head>

<body class="bg-gradient-to-br from-pink-100 via-pink-50 to-pink-200 min-h-screen flex items-center justify-center p-4 font-sans">

  <!-- Tarjeta Principal -->
  <main class="w-full max-w-md bg-white/90 backdrop-blur-md rounded-3xl p-6 sm:p-8 border border-pink-200/80 shadow-2xl flex flex-col items-center">
    
    <!-- Encabezado -->
    <header class="text-center mb-6">
      <h1 class="text-3xl sm:text-4xl font-serif font-bold text-pink-950 tracking-wide mb-1">
        Reloj Rosa
      </h1>
      <p class="text-xs sm:text-sm text-pink-600 font-semibold tracking-wider uppercase">
        Simulación de Tiempo
      </p>
    </header>

    <!-- Contenedor del Reloj -->
    <div class="relative w-64 h-64 sm:w-72 sm:h-72 my-2 flex items-center justify-center">
      
      <!-- Cuerpo del Reloj -->

        <!-- Números de las Horas (12, 3, 6, 9) -->
        <span class="absolute top-3 font-serif font-bold text-pink-900 text-xl">12</span>
        <span class="absolute right-4 font-serif font-bold text-pink-900 text-xl">3</span>
        <span class="absolute bottom-3 font-serif font-bold text-pink-900 text-xl">6</span>
        <span class="absolute left-4 font-serif font-bold text-pink-900 text-xl">9</span>

        <!-- Marcadores de minutos (Generados con JS en posición correcta) -->
        <div id="clock-ticks" class="absolute inset-0 pointer-events-none"></div>

        <!-- Capa de Manecillas con Centro Común -->
        <div class="absolute inset-0 flex items-center justify-center">

          <!-- Manecilla de Horas (vr1) -->
          <div id="hour-hand" class="hand absolute bottom-1/2 w-2 sm:w-2.5 h-16 sm:h-20 bg-gradient-to-t from-pink-900 to-pink-700 rounded-full shadow-md z-10"></div>

          <!-- Manecilla de Minutos (vr2) -->
          <div id="minute-hand" class="hand absolute bottom-1/2 w-1.5 h-22 sm:h-26 bg-gradient-to-t from-pink-600 to-pink-400 rounded-full shadow-md z-20"></div>

          <!-- Manecilla de Segundos (vr3) -->
          <div id="second-hand" class="hand absolute bottom-1/2 w-1 h-26 sm:h-28 bg-rose-500 rounded-full shadow-sm z-30">
            <div class="w-2.5 h-2.5 rounded-full bg-rose-500 absolute top-2 left-1/2 -translate-x-1/2"></div>
          </div>

          <!-- Centro del Reloj (Pivote) -->
          <div class="w-5 h-5 rounded-full bg-pink-600 border-2 border-white shadow-md z-40"></div>

        </div>

      </div>
    </div>

    <!-- Reloj Digital -->
    <div class="mt-4 mb-6 bg-pink-50 px-5 py-1.5 rounded-full border border-pink-200 text-pink-800 font-mono text-sm font-bold shadow-inner flex items-center gap-2">
      <i class="fa-regular fa-clock text-pink-500"></i>
      <span id="digital-clock">00:00:00</span>
    </div>

    <!-- Deslizador de Velocidad Único -->
    <section class="w-full bg-pink-50/80 rounded-2xl p-4 border border-pink-200 flex flex-col gap-3">
      <div class="flex justify-between items-center">
        <label for="speed-slider" class="text-sm font-bold text-pink-900 flex items-center gap-2">
          <i class="fa-solid fa-gauge-high text-pink-500"></i>
          Velocidad Global
        </label>
        <span id="speed-multiplier" class="bg-pink-200 text-pink-900 text-xs font-bold px-3 py-1 rounded-full border border-pink-300">
          1x (Real)
        </span>
      </div>
